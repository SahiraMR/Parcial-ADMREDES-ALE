<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamiento TI - Cyber/Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080710;
            --card-bg: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        button {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            text-shadow: 0 0 5px var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        button:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 0.9rem;
        }

        #statusMsg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AGENDAMIENTO TI</h1>
    <form id="citaForm">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre_cliente" required placeholder="Ej. Sahira Medina">
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="correo_cliente" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label>Servicio TI</label>
            <select id="servicio" required>
                <option value="Soporte Técnico Cloud">Soporte Técnico Cloud</option>
                <option value="Configuración de Redes / VPN">Configuración de Redes / VPN</option>
                <option value="Auditoría de Seguridad">Auditoría de Seguridad</option>
            </select>
        </div>
        <div class="form-group">
            <label>Fecha y Hora</label>
            <input type="datetime-local" id="fecha_cita" required>
        </div>
        <div class="form-group">
            <label>Notas Adicionales</label>
            <textarea id="notas" rows="2" placeholder="Detalles de la solicitud..."></textarea>
        </div>
        <button type="submit">AGENDAR CITA</button>
    </form>
    
    <div id="statusMsg"></div>

    <a class="admin-link" href="https://api-parcial-sahira-e3a7dncchpbmhaaz.chilecentral-01.azurewebsites.net/admin" target="_blank">
        ⚙️ Ir al Panel SQLAdmin (Azure)
    </a>
</div>

<script>
    const API_URL = "https://api-parcial-sahira-e3a7dncchpbmhaaz.chilecentral-01.azurewebsites.net/citas";

    document.getElementById("citaForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const statusMsg = document.getElementById("statusMsg");
        statusMsg.style.color = "#00f3ff";
        statusMsg.innerText = "Enviando solicitud...";

        const inputFecha = document.getElementById("fecha_cita").value;
        const fechaISO = inputFecha ? new Date(inputFecha).toISOString() : "";

        // Construcción de los datos en formato de formulario x-www-form-urlencoded
        const formData = new URLSearchParams();
        formData.append("nombre_cliente", document.getElementById("nombre_cliente").value);
        formData.append("correo_cliente", document.getElementById("correo_cliente").value);
        formData.append("servicio", document.getElementById("servicio").value);
        formData.append("fecha_cita", fechaISO);
        formData.append("notas", document.getElementById("notas").value || "");

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                statusMsg.style.color = "#00ff88";
                statusMsg.innerText = "¡Cita agendada con éxito!";
                document.getElementById("citaForm").reset();
            } else {
                const errorText = await response.text();
                console.error("Error del servidor:", errorText);
                throw new Error("Error en la respuesta del servidor");
            }
        } catch (error) {
            statusMsg.style.color = "#ff007f";
            statusMsg.innerText = "Error al agendar la cita. Intenta de nuevo.";
        }
    });
</script>

</body>
</html>
